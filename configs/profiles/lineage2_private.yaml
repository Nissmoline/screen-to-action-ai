profile_name: lineage2_private
description: "Private sandbox profile for local desktop-agent experiments."
allowed_window_title: "Lineage II"
capture_region:
  left: 0
  top: 0
  width: 1280
  height: 720
fps: 10
action_delay: 0.25
confidence_threshold: 0.90
emergency_stop_hotkey: "ctrl+shift+q"
pause_hotkey: "ctrl+shift+p"
actions:
  - name: no_op
    type: none

  - name: press_f1
    type: key
    key: f1

  - name: press_f2
    type: key
    key: f2

  - name: press_f3
    type: key
    key: f3

  - name: press_f4
    type: key
    key: f4

  - name: press_f5
    type: key
    key: f5

  - name: press_f6
    type: key
    key: f6

  - name: press_f7
    type: key
    key: f7

  - name: press_f8
    type: key
    key: f8

  - name: press_f9
    type: key
    key: f9

  - name: press_f10
    type: key
    key: f10

  - name: press_f11
    type: key
    key: f11

  - name: press_f12
    type: key
    key: f12

  - name: press_escape
    type: key
    key: esc

  - name: left_click
    type: mouse_click
    button: left

  - name: right_click
    type: mouse_click
    button: right

  - name: middle_click
    type: mouse_click
    button: middle
