profile_name: lineage2_private
description: "Private sandbox profile for local desktop-agent experiments."
allowed_window_title: "Lineage II"
capture_region:
  left: 0
  top: 0
  width: 1280
  height: 720
fps: 10
action_delay: 0.25
confidence_threshold: 0.90
emergency_stop_hotkey: "ctrl+shift+q"
pause_hotkey: "ctrl+shift+p"
actions:
  - name: no_op
    type: none

  - name: press_f1
    type: key
    key: f1

  - name: press_f2
    type: key
    key: f2

  - name: press_escape
    type: key
    key: esc

  - name: move_forward
    type: key
    key: w

  - name: move_backward
    type: key
    key: s

  - name: turn_left
    type: key
    key: a

  - name: turn_right
    type: key
    key: d
